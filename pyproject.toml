[project]
name = "gigbid"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "langgraph==0.6.7",
  "langgraph-checkpoint-postgres==2.0.23",
  "langgraph-checkpoint-sqlite==2.0.11",
  "aiosqlite==0.21.0",
  "langgraph-supervisor==0.0.29",
  "langchain-core==0.3.76",
  "langchain-openai==0.3.33",
  "langchain-ollama==0.3.8",
  "langchain-mcp-adapters==0.1.10",
  "mcp==1.14.1",
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sse-starlette==3.0.2",
  "pydantic==2.11.9",
  "httpx==0.28.1",
  "rank-bm25==0.2.2",
  "numpy==2.3.3",
  "fastembed==0.7.3",
  "sqlalchemy==2.0.43",
  "psycopg[binary,pool]==3.2.10",
  "redis==5.3.1",
  "arq==0.26.3",
  "pyyaml==6.0.2",
  "cryptography==45.0.7",
  "pyjwt==2.10.1",
  "bcrypt==4.3.0",
  "python-multipart==0.0.20",
  "pypdf==6.0.0",
  "reportlab==4.4.3",
  "scikit-learn==1.7.2",
  "scipy==1.16.2",
]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.13.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "apps*", "worker*", "gigsim*", "evals*"]

[tool.ruff]
line-length = 140
extend-exclude = ["data", "apps/web", "gigsim/seed_data"]
