[project]
name = "gigbid-portfolio-mcp"
version = "0.1.0"
description = "Read-only MCP server that finds evidence in a freelancer portfolio (case studies, repos, proposals, reviews)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp==1.14.1",
  "pydantic>=2.7,<2.12",  # mcp 1.14.1 uses pydantic internals removed in 2.12
  "pyyaml>=6",
  "uvicorn>=0.30",
]

[project.scripts]
gigbid-portfolio-mcp = "gigbid_portfolio_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gigbid_portfolio_mcp"]
